// Snyk Dependency Extraction Init Script
// Usage: gradle --init-script snyk-deps-init.gradle snykDependencyGraph
//
// Produces: build/reports/snyk-dependency-graph.ndjson
//   Line 1:    metadata JSON object
//   Lines 2+:  one project JSON object per line (newline-delimited JSON)
//
// Optional property: -PsnykTargetBuildFile=<absolutePath>
//   When set, only the project whose build file matches the path runs (skips all others).
//   Used by the Go plugin when --target-file points to a specific sub-project build file.
//
// Uses Gradle's ResolutionResult API (Gradle 4.4+) to programmatically
// walk the resolved dependency graph per-project, per-configuration.
//
// Compatibility: Gradle 5.0+ (uses fully qualified groovy.json.JsonOutput to avoid init script classloading issues)
// Configuration Cache: Not compatible
// Build Files: Auto-detects build.gradle and build.gradle.kts

gradle.projectsEvaluated { g ->
    def root = g.rootProject

    // When snykTargetBuildFile is set, only the matching project runs its task.
    // Otherwise all projects participate (default behaviour).
    def targetBuildFile = root.findProperty('snykTargetBuildFile')?.toString()

    // Check if provenance (checksums) should be included
    def includeProvenance = root.findProperty('snykIncludeProvenance')?.toBoolean() ?: false

    // ── Component metadata (opt-in: -PsnykIncludeComponentMetadata) ──────
    // Shared cross-ecosystem label vocabulary (see snyk-mvn-plugin /
    // nodejs-lockfile-parser): hash:<alg> lowercase-hex digests, and
    // distribution:url — the real remote URL Gradle read the artifact from.
    // distribution:url is TRUE provenance only: Gradle's public API exposes no
    // per-artifact source repository, so we capture actual resource-read URLs
    // via an internal build-operation listener. On a warm cache nothing is
    // re-fetched, so a node simply carries no distribution:url (never a guess).
    //
    // The map and the listener are created here, in the same scope threaded to
    // the per-project tasks, so the listener and the lookups share one instance
    // (a run()-scope local captured across the build lifecycle does not).
    // projectsEvaluated runs before task execution, so the listener is active
    // before any resolution/download happens.
    def includeComponentMetadata = root.findProperty('snykIncludeComponentMetadata')?.toBoolean() ?: false
    def urlsByFilename = new java.util.concurrent.ConcurrentHashMap()
    if (includeComponentMetadata) {
        registerResourceReadListener(urlsByFilename)
    }

    // Parse configuration-attributes filter once upfront for all projects
    def confAttrSpec = root.hasProperty('snykConfAttr') ? 
        parseConfigurationAttributes(root.snykConfAttr) : null

    // One task per project, each writing to its own output file.
    // Isolation makes parallel execution safe; snykDependencyGraph depends on all of these.
    def perProjectTasks = root.allprojects
        .findAll { proj -> !targetBuildFile || getBuildFilePath(proj) == targetBuildFile }
        .collect { proj ->
        // Resolved at configuration time so outputs.file() can register it for up-to-date checking.
        def outputFile = resolveReportsFile(proj, "snyk-project.ndjson")

        proj.task('snykDependencyGraphProject') {
            group = 'reporting'
            description = "Snyk: resolve dependency graph for ${proj.path}"
            outputs.file(outputFile)
            try {
                notCompatibleWithConfigurationCache("Snyk dependency resolution")
            } catch (Exception ignored) {
                // Older Gradle versions don't have this method
            }
            doLast {
                outputFile.parentFile.mkdirs()
                outputFile.text = groovy.json.JsonOutput.toJson(buildProjectEntry(proj, confAttrSpec, includeProvenance, includeComponentMetadata, urlsByFilename))
            }
        }
    }

    def aggregateOutputFile = resolveReportsFile(root, "snyk-dependency-graph.ndjson")

    root.task('snykDependencyGraph') {
        group = 'reporting'
        description = 'Snyk: aggregate dependency graph for all projects'
        dependsOn perProjectTasks
        // No outputs.file declared: this task must always run to print the SNYK_DEPS_NDJSON marker.
        try {
            notCompatibleWithConfigurationCache("Snyk dependency resolution")
        } catch (Exception ignored) {
            // Older Gradle versions don't have this method
        }
        doLast {
            aggregateOutputFile.parentFile.mkdirs()
            aggregateOutputFile.withWriter('UTF-8') { writer ->
                // Line 1: metadata
                writer.println(groovy.json.JsonOutput.toJson(buildMetadata(root)))
                // One line per project, read from each per-project task output then clean up
                perProjectTasks.each { task ->
                    def projectFile = task.outputs.files.singleFile
                    if (projectFile.exists()) {
                        writer.println(projectFile.text.trim())
                        projectFile.delete()
                    }
                }
            }
            println "SNYK_DEPS_NDJSON ${aggregateOutputFile.absolutePath}"
        }
    }
}

// ── Metadata ────────────────────────────────────────────────────────

def buildMetadata(rootProject) {
    def runtime = Runtime.getRuntime()
    [
        gradleVersion   : gradle.gradleVersion,
        javaVersion     : System.getProperty('java.version'),
        javaVendor      : System.getProperty('java.vendor'),
        javaHome        : System.getProperty('java.home'),
        os              : "${System.getProperty('os.name')} ${System.getProperty('os.arch')}",
        generatedAt     : new Date().format("yyyy-MM-dd'T'HH:mm:ss'Z'", TimeZone.getTimeZone('UTC')),
        rootProject     : [
            name   : rootProject.name,
            group  : rootProject.group?.toString() ?: '',
            version: rootProject.version?.toString() ?: 'unspecified',
            path   : rootProject.projectDir.absolutePath,
        ],
        maxMemoryMB     : runtime.maxMemory() / (1024 * 1024) as long,
    ]
}

// ── Per-project entry ───────────────────────────────────────────────

def buildProjectEntry(project, confAttrSpec, includeProvenance = false, includeComponentMetadata = false, urlsByFilename = null) {
    def resolvableConfigs = project.configurations.matching { config ->
        if (!config.canBeResolved) {
            return false
        }
        // Skip auto-created publication configs (default, archives) which have no
        // directly-declared deps. User-defined configs with declared deps are kept.
        if (config.canBeConsumed && config.dependencies.isEmpty()) {
            return false
        }
        // Apply attribute filter if specified
        if (confAttrSpec != null && !matchesAttributeFilter(config, confAttrSpec)) {
            return false
        }
        return true
    }

    def gav = "${project.group}:${project.name}:${project.version}"

    def entry = [
        name      : project.name,
        group     : project.group?.toString() ?: '',
        version   : project.version?.toString() ?: 'unspecified',
        path      : project.path,
        gav       : gav,
        buildFile : getBuildFilePath(project),
        plugins   : project.plugins.collect { it.class.name.replaceAll('_Decorated$', '') },
        configurations: [],
    ]

    resolvableConfigs.each { config ->
        try {
            def configEntry = resolveConfiguration(config, includeProvenance, includeComponentMetadata, urlsByFilename)
            if (configEntry != null) {
                entry.configurations << configEntry
            }
        } catch (Exception e) {
            entry.configurations << [
                name: config.name,
                error: e.message,
            ]
        }
    }

    return entry
}

// ── Configuration resolution ────────────────────────────────────────

def resolveConfiguration(config, includeProvenance = false, includeComponentMetadata = false, urlsByFilename = null) {
    def resolutionResult = config.incoming.resolutionResult
    def rootComponent = resolutionResult.root

    // Per-config set of resolved group:module names; used to avoid surfacing false unresolved deps that strict locking emits alongside real resolved deps.
    def resolvedNames = new HashSet<String>()
    try {
        resolutionResult.allComponents.each { component ->
            def mv = component.moduleVersion
            if (mv != null && mv.group && mv.name) {
                // .toString() is load-bearing — GStrings and Strings hash differently.
                resolvedNames.add("${mv.group}:${mv.name}".toString())
            }
        }
    } catch (Exception ignored) {
        // allComponents may be unavailable in very old Gradle versions; proceed
        // without noise filtering rather than failing the whole configuration.
    }

    def rootId = componentId(rootComponent)
    def processed = new HashSet<String>()
    def ancestry = new HashSet<String>()
    def tree = walkDependencies(rootComponent, processed, ancestry, resolvedNames)

    // Build artifact lookup map once per configuration for O(1) lookups.
    // Needed for provenance checksums and/or component-metadata hashes+URL.
    def artifactLookup = null
    if (includeProvenance || includeComponentMetadata) {
        artifactLookup = buildArtifactLookup(config)
    }

    return [
        name            : config.name,
        description     : config.description ?: '',
        root            : [
            id          : rootId,
            dependencies: tree,
        ],
        // Flat list of all resolved components for quick lookups
        allDependencies: collectAllDependencies(resolutionResult, includeProvenance, artifactLookup, includeComponentMetadata, urlsByFilename),
    ]
}

// ── Recursive tree walk ─────────────────────────────────────────────

def walkDependencies(component, Set<String> processed, Set<String> ancestry, Set<String> resolvedNames = new HashSet<>()) {
    def children = []

    component.dependencies.each { dep ->
        // Use duck typing rather than instanceof — Gradle API classes are not on the
        // classpath when the init script compiles, so instanceof causes a parse error.
        def selected = dep.hasProperty('selected') ? dep.selected : null
        if (selected != null) {
            // ResolvedDependencyResult
            def id = componentId(selected)

            // Constraint edges originate from platform BOMs, dependency locking, and
            // explicit constraints {} blocks. They influence version selection but do
            // not represent real artifact dependencies. Emit them as leaves and do not
            // recurse, mark the target as visited, or affect ancestry — otherwise a
            // real edge to the same component would be incorrectly reported as
            // pruned: visited. Property check guards against older Gradle versions
            // (pre-4.6) where DependencyResult.isConstraint() does not exist.
            def isConstraintEdge = dep.hasProperty('constraint') && dep.constraint
            if (isConstraintEdge) {
                children << [
                    id        : id,
                    constraint: true,
                ]
            } else if (ancestry.contains(id)) {
                // True cycle — this component is on the current ancestor chain
                children << [
                    id    : id,
                    pruned: 'cycle',
                ]
            } else if (processed.contains(id)) {
                // Diamond — already visited elsewhere in this configuration
                children << [
                    id    : id,
                    pruned: 'visited',
                ]
            } else {
                processed.add(id)
                ancestry.add(id)
                children << [
                    id          : id,
                    dependencies: walkDependencies(selected, processed, ancestry, resolvedNames),
                ]
                ancestry.remove(id)
            }
        } else if (dep.hasProperty('attempted')) {
            // UnresolvedDependencyResult: use attempted when available, fall back to requested.
            def selector = dep.hasProperty('attempted') && dep.attempted != null
                ? dep.attempted
                : (dep.hasProperty('requested') ? dep.requested : null)
            // Skip project deps and other non-Maven selectors that have no GAV coordinate.
            if (selector == null || !selector.hasProperty('group') || !selector.hasProperty('module')) return
            // Skip lock-rejected requests — the module resolved fine at the locked version.
            def selectorName = "${selector.group}:${selector.module}".toString()
            if (resolvedNames.contains(selectorName)) return
            def vc = selector.hasProperty('versionConstraint') ? selector.versionConstraint : null
            def simpleVersion = selector.hasProperty('version') ? (selector.version ?: 'unspecified') : 'unspecified'
            def selectorVersion = vc?.requiredVersion ?: vc?.preferredVersion ?: simpleVersion
            children << [
                id        : "${selector.group}:${selector.module}:${selectorVersion}".toString(),
                unresolved: true,
                reason    : dep.failure?.message ?: 'unknown',
            ]
        }
    }

    return children
}

// ── Artifact lookup optimization ───────────────────────────────────

// Builds a lookup map from ComponentIdentifier -> List<ResolvedArtifactResult>
// This converts O(C*A) artifact searches into O(1) lookups per component
def buildArtifactLookup(config) {
    def lookup = [:].withDefault { [] }
    try {
        def artifactCollection = config.incoming.artifacts
        def resolvedArtifacts = null

        // Try different API approaches for Gradle version compatibility
        // We use capability-based detection rather than gradle.gradleVersion parsing
        // to handle custom builds, snapshots, and vendor distributions robustly
        try {
            // Gradle 7+ approach - resolvedArtifacts property
            def artifactsProvider = artifactCollection.resolvedArtifacts
            resolvedArtifacts = artifactsProvider.get()
        } catch (Exception e1) {
            // Gradle 6 approach - direct iteration over artifact collection
            resolvedArtifacts = []
            artifactCollection.each { artifact ->
                if (artifact instanceof org.gradle.api.artifacts.result.ResolvedArtifactResult) {
                    resolvedArtifacts << artifact
                }
            }
        }

        resolvedArtifacts.each { artifact ->
            def componentId = artifact.id.componentIdentifier
            lookup[componentId] << artifact
        }

        return lookup
    } catch (Exception e) {
        return [:] // Return empty map on any error
    }
}

// ── Flat dependency collection ──────────────────────────────────────

def collectAllDependencies(resolutionResult, includeProvenance, artifactLookup, includeComponentMetadata = false, urlsByFilename = null) {
    def all = []

    resolutionResult.allComponents.each { component ->
        def entry = [
            id: componentId(component),
        ]

        if (includeProvenance) {
            def provenance = computeProvenance(component, artifactLookup)
            if (provenance != null) {
                entry.putAll(provenance)
            }
        }
        if (includeComponentMetadata) {
            def metadata = computeComponentMetadata(component, artifactLookup, urlsByFilename)
            if (metadata != null) {
                entry.putAll(metadata)
            }
        }
        all << entry
    }

    return all
}

// ── Helpers ─────────────────────────────────────────────────────────

// parseConfigurationAttributes parses a comma-separated list of key:value pairs.
// Matches the Go validation logic: splits on first colon, trims whitespace.
def parseConfigurationAttributes(attributeString) {
    return attributeString.toLowerCase().tokenize(',').collect { pair ->
        pair = pair.trim()
        def colonIndex = pair.indexOf(':')
        if (colonIndex == -1) {
            throw new IllegalArgumentException("Invalid configuration attribute pair: ${pair}")
        }
        def key = pair.substring(0, colonIndex).trim().toLowerCase()
        def value = pair.substring(colonIndex + 1).trim().toLowerCase()
        [key, value]
    }
}

// matchesAttributeKey determines if an attribute matches a user-provided key.
// Supports multiple matching strategies for maximum compatibility:
// 1. Exact match on logical name (e.g., 'org.gradle.usage')  
// 2. Match on last dotted segment (e.g., 'usage' matches 'org.gradle.usage')
// 3. Match on attribute type simple class name (e.g., 'BuildType' matches BuildTypeAttr)
// 4. Legacy fallback: case-insensitive substring matching on logical name
def matchesAttributeKey(attr, key) {
    def lcKey = key.toLowerCase()

    // 1. Exact match on logical name (standard Gradle attrs: org.gradle.usage, etc.)
    if (attr.name.toLowerCase() == lcKey) {
        return true
    }

    // 2. Match on the last dotted segment of the logical name
    // (so 'usage' matches 'org.gradle.usage')
    def tail = attr.name.tokenize('.').last().toLowerCase()
    if (tail == lcKey) {
        return true
    }

    // 3. Match on the attribute's type simple class name when available
    // (so 'buildtype' or 'buildtypeattr' matches Android's BuildTypeAttr)
    if (attr.hasProperty('type') && attr.type != null) {
        def simple = attr.type.simpleName.toLowerCase()
        if (simple == lcKey || simple == lcKey + 'attr') {
            return true
        }
    }

    // 4. Legacy fallback: case-insensitive substring on the logical name,
    // preserved so existing CLI invocations keep working.
    return attr.name.toLowerCase().contains(lcKey)
}

// matchesAttributeFilter determines if a configuration matches the attribute filter spec.
// Returns true only if ALL specified attribute constraints are satisfied.
def matchesAttributeFilter(config, confAttrSpec) {
    def attrs = config.attributes

    // All constraints must be satisfied
    for (keyValueFilter in confAttrSpec) {
        def key = keyValueFilter[0]
        def expectedValue = keyValueFilter[1]

        def found = false
        // Look for any attribute that matches this key
        for (attr in attrs.keySet()) {
            if (matchesAttributeKey(attr, key)) {
                found = true
                def actualValue = attrs.getAttribute(attr).toString().toLowerCase()
                if (actualValue != expectedValue) {
                    return false
                }
                break // Found matching attribute with correct value, check next constraint
            }
        }

        if (!found) {
            return false
        }
    }

    return true
}

def getBuildFilePath(project) {
    try {
        if (project.hasProperty('layout') && project.layout.hasProperty('projectDirectory')) {
            def projectDir = project.layout.projectDirectory.asFile
            def found = ['build.gradle', 'build.gradle.kts'].find { fileName ->
                new File(projectDir, fileName).exists()
            }
            return found ? new File(projectDir, found).absolutePath
                         : new File(projectDir, 'build.gradle').absolutePath
        }
    } catch (Exception e) {
        // Fallback for older Gradle versions or API failures
    }

    // Fallback to deprecated API for compatibility with Gradle < 6
    return project.buildFile?.absolutePath ?: ''
}

def componentId(component) {
    def mv = component.moduleVersion
    if (mv != null && mv.group && mv.name) {
        return "${mv.group}:${mv.name}:${mv.version}"
    }
    // Fallback for project components
    return component.id.toString()
}

// Returns <proj.buildDir>/reports/<fileName>. Uses layout API (Gradle 6+);
// falls back to the deprecated buildDir property for Gradle 5.
def resolveReportsFile(project, String fileName) {
    try {
        return new File(project.layout.buildDirectory.dir("reports").get().asFile, fileName)
    } catch (Exception e) {
        return new File(project.buildDir, "reports/${fileName}")
    }
}

// Computes provenance information (SHA1 hash and file type) for a resolved component
// Uses the current configuration's artifacts to find the right artifact for this component
def computeProvenance(component, artifactLookup) {
    try {
        // Check if this is a ModuleComponentIdentifier (external dependency)
        def id = component.id
        if (!id.hasProperty('group') || !id.hasProperty('module') || !id.hasProperty('version')) {
            // Skip project components or components without standard GAV coordinates
            return null
        }

        def moduleVersion = component.moduleVersion
        if (moduleVersion == null) {
            return null
        }

        // Use O(1) artifact lookup
        def matchingArtifacts = artifactLookup[component.id] ?: []

        if (!matchingArtifacts.empty) {
            // Use the first matching artifact (typically the main JAR)
            def artifact = matchingArtifacts.first()
            def file = artifact.file

            // Extract artifact type from file extension (most reliable approach)
            def type = file.name.lastIndexOf('.') >= 0 ? 
                file.name.substring(file.name.lastIndexOf('.') + 1) : 'jar'

            // Try to get checksum from Gradle's built-in mechanisms first
            def checksum = getGradleChecksum(file, artifact)
            if (checksum == null) {
                // Fallback to manual calculation if Gradle doesn't provide it
                checksum = computeSHA1(file)
            }

            if (checksum != null) {
                return [
                    checksum: checksum,
                    type: type
                ]
            }
        }
        // Note: BOM/platform dependencies typically don't have traditional artifacts
        // with files that can be checksummed, so we skip provenance for these

        return null
    } catch (Exception e) {
        // Return null on any error to avoid breaking the build
        return null
    }
}

// Attempts to get checksum from Gradle's built-in ChecksumService
// Returns null if not available, falling back to manual calculation
def getGradleChecksum(File file, artifact) {
    // Use Gradle's internal ChecksumService for optimized SHA1 calculation
    // This is available in Gradle 6+ and provides fast, cached checksums

    if (file.exists()) {
        try {
            def services = gradle.services
            def checksumService = services.get(org.gradle.internal.hash.ChecksumService)
            def hashCode = checksumService.sha1(file)
            def result = hashCode.toString()
            return result
        } catch (Exception e) {
            // ChecksumService may not be available in all Gradle versions or builds
        }
    }
    return null
}

// Stream a file once, feeding every requested digest from a single read.
// `algorithms` maps the JDK algorithm name to its output label; returns
// {label: lowercase-hex}. Shared by every file-hashing helper below.
def digestFile(File file, Map<String, String> algorithms) {
    def javaNames = algorithms.keySet().toList()
    def mds = javaNames.collect { java.security.MessageDigest.getInstance(it) }
    // Reuse a single 64 KB buffer for the whole file. Groovy's
    // File.eachByte(int, Closure) allocates a fresh byte[] copy per chunk, so
    // hashing large artifacts churns enough short-lived garbage to inflate the
    // Gradle daemon's peak heap; a manual read loop keeps allocation ~constant.
    // Digests are identical either way — MessageDigest is chunking-invariant.
    // All state is local, so this stays safe under parallel per-project tasks.
    byte[] buffer = new byte[64 * 1024]
    file.withInputStream { input ->
        int read
        while ((read = input.read(buffer)) != -1) {
            for (md in mds) {
                md.update(buffer, 0, read)
            }
        }
    }
    def result = [:]
    javaNames.eachWithIndex { javaName, i ->
        result[algorithms[javaName]] = mds[i].digest().encodeHex().toString()
    }
    return result
}

// Computes SHA1 hash of a file (used for provenance checksums).
def computeSHA1(File file) {
    try {
        if (!file.exists()) {
            return null
        }
        return digestFile(file, ['SHA-1': 'sha-1'])['sha-1']
    } catch (Exception e) {
        return null
    }
}

// ── Component metadata helpers ──────────────────────────────────────

// Computes md5/sha-1/sha-256/sha-512 in a single pass over the file bytes.
// Keys match the CycloneDX-friendly label suffixes used across ecosystems.
def computeHashes(File file) {
    return digestFile(file, ['MD5': 'md5', 'SHA-1': 'sha-1', 'SHA-256': 'sha-256', 'SHA-512': 'sha-512'])
}

// Reduce an already-parsed resource URI to its canonical location —
// scheme://host[:port]/path — by dropping userInfo, query and fragment.
// Standard Maven/Gradle repos authenticate via headers and serve artifacts at
// plain path-based URLs, but a repo configured with credentials embedded in the
// URL (https://user:pass@host/repo) carries that userInfo on every artifact
// URL, so we strip it to keep credentials out of the dep-graph/SBOM. Query and
// fragment are dropped too: they are not part of the artifact's durable
// location (at most a request-scoped redirect artefact), so the bare path is
// the correct, reproducible provenance value. Operating on the parsed URI keeps
// the rule single and robust.
def canonicalUrl(URI u) {
    try {
        // Reduce to the authority minus any embedded userInfo. We can't use
        // u.host/u.port here: Java leaves getHost() null for any authority it
        // deems registry-based rather than server-based — notably hosts
        // containing an underscore, common on internal Maven mirrors — which
        // would silently drop the host from the label. getAuthority() preserves
        // it, so we strip the "user:pass@" prefix ourselves to keep credentials
        // out of the dep-graph/SBOM.
        def authority = u.authority
        if (authority == null) return null
        int at = authority.lastIndexOf('@')
        if (at >= 0) authority = authority.substring(at + 1)
        return new URI(u.scheme, authority, u.path, null, null).toString()
    } catch (Exception ignored) {
        // Fail closed: if the URI can't be rebuilt from its
        // components we cannot guarantee userinfo/query/fragment were stripped,
        // so drop it entirely rather than risk a credential surviving into a
        // label. The caller records nothing when this returns null.
        return null
    }
}

// Register an internal build-operation listener recording the URL of every
// external resource Gradle reads during resolution — the only signal carrying
// true per-artifact provenance. Internal + unstable across versions, so the
// whole thing is best-effort: any failure degrades to "no distribution:url".
def registerResourceReadListener(urlsByFilename) {
    try {
        def manager = gradle.services.get(org.gradle.internal.operations.BuildOperationListenerManager)
        // Map-of-closures coerced to the interface: closures take untyped args,
        // satisfying the interface's typed abstract methods on every Gradle
        // version (the method set has changed over time). Absent methods no-op.
        def listener = [
            started : { buildOp, startEvent -> },
            progress: { operationId, progressEvent -> },
            finished: { buildOp, finishEvent -> recordResourceRead(buildOp, urlsByFilename) },
        ] as org.gradle.internal.operations.BuildOperationListener
        manager.addListener(listener)
        // BuildOperationListenerManager is a daemon-scoped service, so a listener
        // added here otherwise survives into later builds on a reused daemon —
        // accumulating one per build, each pinning its build's captured state.
        // Remove it when this build finishes. buildFinished is deprecated on newer
        // Gradle but remains the most portable cleanup hook across 4.x–9.x;
        // guarded so an unavailable hook never breaks resolution.
        try {
            gradle.buildFinished { manager.removeListener(listener) }
        } catch (Exception ignored) {
            // No usable build-finished hook: the listener is reclaimed when the
            // daemon exits, so the worst case is a bounded per-build leak.
        }
    } catch (Exception ignored) {
        // Internal API unavailable on this Gradle version — distribution:url
        // simply won't be populated; hashes are unaffected.
    }
}

// Record one finished build operation's URL if it is an external-resource read.
// Duck-typed on getLocation() to avoid importing the internal details type
// (whose package has moved across Gradle versions).
def recordResourceRead(buildOp, urlsByFilename) {
    try {
        def details = buildOp?.details
        if (details == null) return
        if (!details.metaClass.respondsTo(details, 'getLocation')) return
        def loc = details.getLocation()
        if (loc == null) return
        def url = loc.toString()
        if (!(url.startsWith('http://') || url.startsWith('https://'))) return
        def uri
        try { uri = new URI(url) } catch (Exception ignored) { return }
        // Derive the filename from the parsed path (already free of query and
        // fragment), then store the canonicalised, credential-free URL.
        def path = uri.path
        if (!path) return
        int slash = path.lastIndexOf('/')
        if (slash < 0 || slash == path.length() - 1) return
        def filename = path.substring(slash + 1)
        def clean = canonicalUrl(uri)
        if (clean == null) return
        urlsByFilename
            .computeIfAbsent(filename) { _ -> java.util.Collections.synchronizedSet(new LinkedHashSet()) }
            .add(clean)
    } catch (Exception ignored) { /* one bad op must not break resolution */ }
}

// Build the per-node component metadata (hashes + distribution:url) for a
// resolved external component. Returns null when nothing could be derived.
def computeComponentMetadata(component, artifactLookup, urlsByFilename) {
    try {
        def id = component.id
        if (!id.hasProperty('group') || !id.hasProperty('module') || !id.hasProperty('version')) return null
        def moduleVersion = component.moduleVersion
        if (moduleVersion == null) return null
        def matchingArtifacts = (artifactLookup ? artifactLookup[component.id] : null) ?: []
        if (matchingArtifacts.empty) return null
        def file = matchingArtifacts.first().file
        if (file == null || !file.isFile()) return null
        def result = [hashes: computeHashes(file)]
        def url = lookupDistributionUrl(
            "${moduleVersion.group}:${moduleVersion.name}".toString(),
            moduleVersion.version?.toString(),
            file.name,
            urlsByFilename)
        if (url) result.distributionUrl = url
        return result
    } catch (Exception ignored) {
        return null
    }
}

// Resolve a filename to the URL it was actually read from. Always confirm the
// captured URL belongs to THIS artifact's Maven-layout path before labelling:
// a shared build can read the same filename from more than one repo, and even
// a lone captured URL may belong to a different GAV that happens to share a
// filename. If no candidate — or more than one — matches the layout, emit
// nothing rather than guess.
def lookupDistributionUrl(String name, String version, String fileName, urlsByFilename) {
    if (urlsByFilename == null) return null
    def candidates = urlsByFilename.get(fileName)
    if (!candidates || candidates.isEmpty()) return null
    try {
        def group = name.contains(':') ? name.substring(0, name.indexOf(':')) : name
        def module = name.contains(':') ? name.substring(name.indexOf(':') + 1) : name
        def suffix = "/${group.replace('.', '/')}/${module}/${version}/${fileName}".toString()
        def matches = candidates.findAll { candidate ->
            try {
                return new URI(candidate).path?.endsWith(suffix)
            } catch (Exception ignored) {
                return false
            }
        }
        if (matches.size() == 1) return matches[0]
    } catch (Exception ignored) { /* fall through to no-label */ }
    return null
}
